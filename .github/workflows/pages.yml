name: Deploy to GitHub Pages

# Publishes the static prototype to GitHub Pages so it can be opened on any
# device (e.g. an iPhone) via the generated URL. The site is just static files,
# so we upload the repo as-is — no build step.

on:
  push:
    branches:
      - claude/spiderman-3rd-person-prototype-rp0wdg
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to auto-enable Pages for the repo (requires repo/org to allow it).
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
